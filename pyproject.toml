[project]
name = "fastapi-app"
version = "0.1.0"
description = "FastAPI 脚手架项目"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "redis>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "email-validator>=2.0",
    "pyjwt>=2.14.0",
    "pwdlib[argon2]>=0.3.1",
    "alembic>=1.20.0",
    "slowapi>=0.1.10",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "asyncmy>=0.2.15",
    "greenlet>=3.5.6",
    # asyncmy 的 caching_sha2_password 握手依赖它：MySQL 8 默认该认证方式，
    # 且服务端认证缓存为空（首次连接、MySQL 重启/主从切换后）时必须走 RSA 加密，
    # 缺包会直接 RuntimeError 连不上库。PyMySQL 自带实现不受影响，所以只有
    # 应用运行时的异步驱动受影响——缺失时表现为「重启 MySQL 后服务连不上」。
    "cryptography>=42",
    "croniter>=6.2.4",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
# B008: FastAPI 依赖注入惯用法 Depends() 必须写在参数默认值里
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = false
# 逐步收紧：先要求所有函数签名完整标注（strict 的其余选项待存量补齐后再开）
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["alembic/versions/"]

# 测试代码不强制逐函数标注：pytest fixture 与 client 参数类型价值低、噪音大
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=app", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy asyncio 通过 greenlet 切换执行上下文，不声明 greenlet 并发会导致
# greenlet 内执行的代码行（service/repository 的 await 链）不被统计，覆盖率失真
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]
