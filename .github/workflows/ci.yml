name: CI

on:
  push:
    branches: [main]
  pull_request:

# 注意：MYSQL_* 不要放在 job 级 env —— Settings 会读它，而 test_settings.py
# 验证的是「未配置时按 MODE 回落」的默认值，被外部值覆盖会误失败。
# 因此连接信息只给到真正连库的步骤（迁移两步），测试步骤只传 TEST_DATABASE_URL。
env:
  SECRET_KEY: ci-only-secret-key-long-enough-for-hs256
  # 置空即回落到 SQLite 内存库（默认）；MySQL 步骤会覆盖为真实连接串
  TEST_DATABASE_URL: ""

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: fastapi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare MySQL account
        # 用 MySQL 8 默认的 caching_sha2_password（与生产一致，不要改回
        # mysql_native_password）：该认证方式在服务端缓存为空时必须走 RSA 加密，
        # asyncmy 需要 cryptography，漏了这个依赖就只在「MySQL 重启/主从切换后」
        # 暴露成连不上库。cryptography 已是项目依赖，CI 用默认方式才能真正覆盖它。
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -p123456 -e "
            CREATE USER IF NOT EXISTS 'ci'@'%' IDENTIFIED BY 'ci-pass';
            GRANT ALL PRIVILEGES ON *.* TO 'ci'@'%';
            FLUSH PRIVILEGES;"

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app tests

      - name: Apply migrations
        # 验证迁移链在真实 MySQL 上可执行（SQLite 覆盖不到方言差异）
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-pass
          MYSQL_DATABASE: fastapi_test
        run: uv run alembic upgrade head

      - name: Check migration drift
        # 模型与迁移必须一致：漏生成迁移在这里就失败，而不是等到线上 500
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-pass
          MYSQL_DATABASE: fastapi_test
        run: uv run alembic check

      - name: Pytest (SQLite)
        run: uv run pytest --cov=app --cov-fail-under=82

      - name: Pytest (MySQL)
        # 同一套用例跑在真实 MySQL 上，覆盖 SQLite 测不到的方言行为
        env:
          TEST_DATABASE_URL: mysql+asyncmy://ci:ci-pass@127.0.0.1:3306/fastapi_test
        run: uv run pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build Docker image
        run: docker build -t fastapi_app .
