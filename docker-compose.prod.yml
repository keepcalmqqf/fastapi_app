services:
  #  依赖
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: fastapi_db
    # 数据库端口只绑定本机，不暴露到公网；对外仅开放应用 8000 端口
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: redis:7
    restart: unless-stopped
    # 启用 AUTH 密码（需在 .env 中设置 REDIS_PASSWORD）
    # appendonly：refresh 令牌的 jti 只存 Redis，默认 RDB 快照丢数据会让全员被登出，
    # 开 AOF 把丢失窗口压到 1 秒
    command: ["redis-server", "--requirepass", "$${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  #  应用
  fastapi_app:
    build: .
    image: fastapi_app
    restart: unless-stopped
    environment:
      MODE: "PROD"
      SECRET_KEY: ${SECRET_KEY}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 限流：登录/注册等接口无本地防爆破，全局限流是唯一兜底，生产务必开启。
      # 值偏保守（100/minute 按 IP 计），如需对登录接口单独收紧请在网关侧配置。
      ENABLE_RATE_LIMIT: "true"
      RATE_LIMIT: "100/minute"
      # 限流计数挪到 Redis：否则 N 个 worker 各有内存计数，实际阈值放大成 100 × N
      RATE_LIMIT_STORAGE_URI: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      # 生产建议开启指标采集；不配 METRICS_TOKEN 时 /metrics 公开，务必一起设置
      ENABLE_METRICS: "true"
      METRICS_TOKEN: ${METRICS_TOKEN}
      # 空库自举：保持关闭（默认），首个管理员由运维用 CLI/脚本创建，
      # 避免服务启动后任何人抢先调用 /user/ 成为管理员
      ALLOW_BOOTSTRAP: "false"
      # 文档开关：PROD 模式默认关闭 /docs 与 /openapi.json，如需临时开启改为 "true"
      # ENABLE_DOCS: "true"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  redis_data:
