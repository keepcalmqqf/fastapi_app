[alembic]
script_location = alembic
prepend_sys_path = .
# 占位值：真实连接串由 alembic/env.py 从 app.core.settings 读取后直接传给
# SQLAlchemy。不要在这里填真实密码——configparser 会对本文件做 `%(...)s` 插值，
# 含百分号的密码（如 `!` 编码为 `%21`）会导致启动报错。
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
