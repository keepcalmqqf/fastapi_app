[alembic]
script_location = alembic
prepend_sys_path = .
# NOTE: keep this file pure ASCII. Alembic reads it with encoding="locale",
# which is GBK/CP936 on Chinese Windows - any UTF-8 byte would crash
# `alembic upgrade head` with UnicodeDecodeError.
#
# Placeholder only: the real DSN is built in alembic/env.py from
# app.core.settings and passed straight to SQLAlchemy. Never put a real
# password here - configparser applies `%(...)s` interpolation, so a
# percent-encoded password (e.g. `!` -> `%21`) breaks startup.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
